[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forenx"
version = "0.1.0"
description = "Offline-first DVR/NVR forensic recovery and analysis platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - evaluation pending" }
authors = [{ name = "ForenX Team" }]
dependencies = [
  "av>=18.1,<19",
  "cryptography>=50.0.1,<51",
  "fastapi>=0.116,<1",
  "numpy>=2.0,<2.5",
  "onnxruntime>=1.29,<1.30",
  "pillow>=12,<13",
  "pydantic>=2.11,<3",
  "reportlab>=4.4,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
forenx-server = "forenx.server:main"
forenx-verify = "forenx.package.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pypdf>=6.0,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-reportlab>=4.4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forenx = ["ui/*.html", "ui/*.css", "ui/*.js", "models/*.onnx", "models/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["forenx"]
omit = ["src/forenx/video/inspect_worker.py", "src/forenx/biometrics/detect_worker.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["forenx"]
